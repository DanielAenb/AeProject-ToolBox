<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tarifario · Ae Project .studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css" />

<style>
  /* ============================================================
     Header de aplicación
     ============================================================ */
  .app-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .app-header .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; letter-spacing: -0.01em;
    color: var(--text);
  }
  .app-header .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-subtle);
  }
  .app-header .brand-name { font-size: 14px; }
  .app-header .brand-tld { color: var(--text-subtle); font-size: 14px; font-weight: 400; }
  .app-header .tool-name {
    font-size: 13px; color: var(--text-muted);
    padding-left: 12px; margin-left: 4px;
    border-left: 1px solid var(--border);
  }
  .app-header .spacer { flex: 1; }
  .app-header .actions { display: flex; gap: 6px; align-items: center; }

  .theme-toggle {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-md);
    color: var(--text-muted);
    transition: all var(--dur) var(--ease);
  }
  .theme-toggle:hover { background: var(--surface-2); color: var(--text); }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* ============================================================
     Layout
     ============================================================ */
  .tarifario-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 460px;
    gap: 24px;
    padding: 24px;
    max-width: 1480px;
    margin: 0 auto;
    align-items: start;
  }

  /* ---------- Catálogo ---------- */
  .cat-block { margin-bottom: 32px; }
  .cat-block:last-child { margin-bottom: 0; }
  .cat-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .cat-head .cat-name {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-subtle);
    white-space: nowrap;
  }
  .cat-head .cat-rule { flex: 1; height: 1px; background: var(--border); }
  .cat-head .cat-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-subtle);
  }

  .serv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }

  .serv {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color var(--dur) var(--ease),
                transform var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
    cursor: pointer;
    font: inherit; color: inherit;
  }
  .serv:hover {
    transform: translateY(-2px);
    border-color: transparent;
    box-shadow: var(--shadow-md);
  }
  .serv:active { transform: translateY(0); }
  .serv .serv-name {
    font-size: 13.5px; font-weight: 600;
    line-height: 1.35;
    color: var(--text);
  }
  .serv .serv-desc {
    font-size: 12px; color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .serv .serv-foot {
    margin-top: auto;
    padding-top: 10px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px;
  }
  .serv .serv-price {
    font-size: 15px; font-weight: 700;
    color: var(--brand);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .serv .serv-price small {
    font-weight: 500; font-size: 11px;
    color: var(--text-subtle);
    letter-spacing: 0;
    margin-left: 4px;
  }
  .serv .serv-range {
    font-size: 11px;
    color: var(--text-subtle);
    font-family: var(--font-mono);
  }

  /* ---------- Panel de cotización ---------- */
  .cotizacion {
    position: sticky;
    top: 84px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 20px;
    max-height: calc(100vh - 108px);
    display: flex; flex-direction: column;
    gap: 16px;
  }
  .cotizacion .cot-head {
    display: flex; align-items: center; gap: 8px;
  }
  .cotizacion .cot-title {
    font-size: 14px; font-weight: 600;
  }
  .cotizacion .cot-body {
    display: flex; flex-direction: column; gap: 14px;
    overflow-y: auto;
    padding-right: 4px;
    margin-right: -4px;
  }
  .cotizacion .cot-body::-webkit-scrollbar { width: 6px; }
  .cotizacion .cot-body::-webkit-scrollbar-thumb {
    background: var(--surface-3); border-radius: 3px;
  }

  .meta-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .meta-fields .field-full { grid-column: 1 / -1; }

  /* Items */
  .items-list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 8px;
    transition: border-color var(--dur) var(--ease);
  }
  .item:hover { border-color: var(--border-strong); }
  .item .item-name {
    grid-column: 1 / 2;
    font-size: 13px; font-weight: 600;
    line-height: 1.3;
    overflow: hidden;
    color: var(--text);
  }
  .item .item-name input {
    width: 100%;
    font: inherit; font-weight: 600;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-xs);
    padding: 2px 4px; margin: -2px -4px;
    color: inherit;
    transition: all var(--dur) var(--ease);
  }
  .item .item-name input:hover { border-color: var(--border); }
  .item .item-name input:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--brand);
  }
  .item .item-remove {
    grid-column: 2 / 3;
    width: 22px; height: 22px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    color: var(--text-subtle);
    transition: all var(--dur) var(--ease);
  }
  .item .item-remove:hover {
    background: var(--danger-subtle);
    color: var(--danger);
  }

  /* Descripción editable por ítem (auto-resize) */
  .item .item-desc {
    grid-column: 1 / -1;
    width: 100%;
    font: inherit;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-xs);
    padding: 4px 6px;
    margin: -2px -6px;
    resize: none;
    overflow: hidden;
    min-height: 22px;
    transition: background var(--dur) var(--ease),
                border-color var(--dur) var(--ease),
                color var(--dur) var(--ease);
  }
  .item .item-desc::placeholder {
    color: var(--text-subtle);
    font-style: italic;
  }
  .item .item-desc:hover { border-color: var(--border); }
  .item .item-desc:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--brand);
    color: var(--text);
    box-shadow: 0 0 0 3px var(--brand-glow);
  }

  .item .item-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 6px;
    align-items: center;
    margin-top: 2px;
  }
  .item .item-row input {
    width: 100%;
    height: 28px;
    padding: 0 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: all var(--dur) var(--ease);
  }
  .item .item-row input:hover { border-color: var(--border-strong); }
  .item .item-row input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-glow);
  }
  .item .item-sub {
    font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    min-width: 68px; text-align: right;
  }
  .item .item-hint {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-subtle);
  }
  .item .qty-suffix { position: relative; }
  .item .qty-suffix input { padding-right: 28px; }
  .item .qty-suffix::after {
    content: attr(data-unit);
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    pointer-events: none;
  }

  .empty-msg {
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
    padding: 22px 14px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* Totales */
  .totales {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    display: flex; flex-direction: column; gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .totales .l {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--text-muted);
  }
  .totales .l.big {
    padding-top: 12px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    font-size: 20px; font-weight: 700;
    color: var(--text);
    letter-spacing: -0.015em;
  }
  .totales .disc-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--text-muted);
    gap: 8px;
  }
  .totales .disc-row .disc-input {
    width: 72px; height: 28px;
    text-align: right;
    padding: 0 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: all var(--dur) var(--ease);
  }
  .totales .disc-row .disc-input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-glow);
  }
  .totales .disc-row .disc-suffix {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-subtle);
    margin-left: -4px;
  }

  /* Saved list */
  .saved-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .saved-list { display: flex; flex-direction: column; gap: 6px; }
  .saved-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 12.5px;
    transition: all var(--dur) var(--ease);
  }
  .saved-item:hover { border-color: var(--border-strong); }
  .saved-item .si-name {
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text);
  }
  .saved-item .si-date {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-subtle);
  }
  .saved-item button {
    width: 24px; height: 24px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-xs);
    color: var(--text-subtle);
    transition: all var(--dur) var(--ease);
  }
  .saved-item button:hover {
    background: var(--surface-3);
    color: var(--text);
  }
  .saved-item button.danger:hover {
    background: var(--danger-subtle);
    color: var(--danger);
  }

  /* ---------- Modal ---------- */
  .modal-head {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .modal-title {
    flex: 1;
    font-size: 16px; font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .modal-x {
    width: 28px; height: 28px;
    margin: -4px -4px 0 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    color: var(--text-subtle);
    transition: all var(--dur) var(--ease);
  }
  .modal-x:hover { background: var(--surface-2); color: var(--text); }
  .modal-body {
    font-size: 13.5px; color: var(--text-muted);
    line-height: 1.55;
    margin-bottom: 20px;
  }
  .modal-input { margin-bottom: 20px; }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* Toast host */
  .toast-host {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .toast-host .toast {
    pointer-events: auto;
    animation: toastIn 260ms var(--ease);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
  }

  /* Responsive */
  @media (max-width: 1080px) {
    .tarifario-main { grid-template-columns: 1fr; padding: 16px; }
    .cotizacion { position: static; max-height: none; }
    .app-header { padding: 10px 16px; flex-wrap: wrap; }
    .app-header .tool-name { display: none; }
  }
  @media (max-width: 520px) {
    .meta-fields { grid-template-columns: 1fr; }
    .serv-grid { grid-template-columns: 1fr; }
    .app-header .actions .label-hide { display: none; }
  }
</style>
</head>

<body>

<!-- ============================================================ HEADER -->
<header class="app-header">
  <a href="../index.html" class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Ae Project</span>
    <span class="brand-tld">.studio</span>
  </a>
  <span class="tool-name">Tarifario · Cotizador</span>
  <div class="spacer"></div>

  <div class="actions">
    <button class="btn btn-ghost btn-sm" id="btnNueva">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label-hide">Nueva</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="btnExportar">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      <span class="label-hide">Exportar</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="btnImportar">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>
      <span class="label-hide">Importar</span>
    </button>
    <button class="btn btn-secondary btn-sm" id="btnGuardar">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span class="label-hide">Guardar</span>
    </button>
    <button class="btn btn-primary btn-sm" id="btnImprimir">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      PDF
    </button>

    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
      <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</header>

<!-- ============================================================ MAIN -->
<main class="tarifario-main">

  <div class="catalogo" id="catalogo"></div>

  <aside class="cotizacion">
    <div class="cot-head">
      <svg class="icon" viewBox="0 0 24 24" style="color:var(--text-muted)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="cot-title">Cotización</span>
      <div class="spacer" style="flex:1"></div>
      <span class="badge" id="badgeCount">0 ítems</span>
    </div>

    <div class="cot-body">

      <div class="meta-fields">
        <div class="field">
          <label class="field-label">Cliente</label>
          <input class="input" type="text" id="cliente" placeholder="Estudio Norte" />
        </div>
        <div class="field">
          <label class="field-label">Fecha</label>
          <input class="input" type="date" id="fecha" />
        </div>
        <div class="field field-full">
          <label class="field-label">Proyecto</label>
          <input class="input" type="text" id="proyecto" placeholder="Propuesta y plan de contenido" />
        </div>
      </div>

      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span class="field-label" style="margin:0">Ítems</span>
          <button class="btn btn-ghost btn-sm" id="btnCustom" style="height:22px;padding:0 8px;font-size:11.5px">
            <svg class="icon icon-sm" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M12 5v14M5 12h14"/></svg>
            Personalizado
          </button>
        </div>
        <div class="items-list" id="itemsList"></div>
      </div>

      <div class="totales">
        <div class="l">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="disc-row">
          <span>Descuento</span>
          <div style="display:flex;align-items:center;gap:2px">
            <input class="disc-input" type="number" id="descuento" min="0" max="100" step="1" value="0" />
            <span class="disc-suffix">%</span>
          </div>
        </div>
        <div class="l big">
          <span>Total</span>
          <span id="total">$0.00</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Notas y condiciones</label>
        <textarea class="textarea" id="notas" placeholder="Anticipo 50%. 2 rondas de cambios incluidas. Entrega en 5 días hábiles." style="min-height:70px"></textarea>
      </div>

      <button class="btn btn-ghost btn-sm" id="btnLimpiar" style="color:var(--danger);width:100%">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Vaciar cotización
      </button>

      <div class="saved">
        <div class="saved-head">
          <span class="field-label" style="margin:0">Guardadas</span>
          <span class="badge" id="badgeSaved">0</span>
        </div>
        <div class="saved-list" id="savedList"></div>
      </div>

    </div>
  </aside>

</main>

<!-- Modal reutilizable -->
<div class="modal" id="appModal" role="dialog" aria-modal="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h3 class="modal-title" id="modalTitle"></h3>
      <button class="modal-x" data-close aria-label="Cerrar">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="modal-body" id="modalBody"></p>
    <div class="modal-input" id="modalInputWrap" hidden>
      <input class="input" id="modalInput" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<div class="toast-host" id="toastHost"></div>

<script src="assets/utils.js"></script>
<script>
/* ============================================================
   DATOS — edita aquí precios y servicios
   ============================================================ */
const SERVICIOS = [
  { id:"h-operativa", cat:"Tarifas por hora", nombre:"Hora operativa base", desc:"Para presupuestos a medida o tareas misceláneas.", precio:5, unidad:"hora" },

const LS_KEY = "tarifario-cotizador-v3";

let state = {
  cliente: "",
  proyecto: "",
  fecha: today(),
  descuento: 0,
  notas: "",
  items: [],
  guardadas: [],
};

function save() { store.set(LS_KEY, state); }
function load() {
  const saved = store.get(LS_KEY);
  if (saved) state = { ...state, ...saved };
  if (!state.fecha) state.fecha = today();
}

const servicio = id => SERVICIOS.find(s => s.id === id);
const precioBase = s => s.precio != null ? s.precio : s.precioMin;

/* ============================================================
   MODAL — reemplaza prompt() y confirm()
   ============================================================ */
const Modal = (() => {
  const el = () => $('#appModal');
  let onConfirmCb = null;
  let keyHandler = null;

  function open({ title, body, input, placeholder, defaultValue, confirmLabel = 'Confirmar', cancelLabel = 'Cancelar', danger = false, onConfirm }) {
    $('#modalTitle').textContent = title || '';
    const bodyEl = $('#modalBody');
    bodyEl.textContent = body || '';
    bodyEl.hidden = !body;

    const inputWrap = $('#modalInputWrap');
    const inputEl = $('#modalInput');
    if (input) {
      inputWrap.hidden = false;
      inputEl.placeholder = placeholder || '';
      inputEl.value = defaultValue || '';
      inputEl.type = input === 'password' ? 'password' : 'text';
    } else {
      inputWrap.hidden = true;
      inputEl.value = '';
    }

    const confirmBtn = $('#modalConfirm');
    confirmBtn.textContent = confirmLabel;
    confirmBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
    $('#modalCancel').textContent = cancelLabel;

    onConfirmCb = onConfirm;
    el().classList.add('on');

    setTimeout(() => {
      if (input) { inputEl.focus(); inputEl.select(); }
      else confirmBtn.focus();
    }, 60);

    keyHandler = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Enter') {
        // Enter confirma; salvo que el foco esté en un botón de cancelar
        if (e.target && e.target.id === 'modalCancel') return;
        e.preventDefault();
        triggerConfirm();
      }
    };
    document.addEventListener('keydown', keyHandler);
  }

  function triggerConfirm() {
    const hasInput = !$('#modalInputWrap').hidden;
    const value = hasInput ? $('#modalInput').value.trim() : null;
    const result = onConfirmCb ? onConfirmCb(value) : true;
    if (result !== false) close();
  }

  function close() {
    el().classList.remove('on');
    onConfirmCb = null;
    if (keyHandler) document.removeEventListener('keydown', keyHandler);
    keyHandler = null;
  }

  function init() {
    el().querySelectorAll('[data-close]').forEach(n => n.addEventListener('click', close));
    $('#modalConfirm').addEventListener('click', triggerConfirm);
  }

  return { open, close, init };
})();

/* ============================================================
   TOASTS
   ============================================================ */
function toast(title, desc = '', variant = 'brand') {
  const icons = {
    brand:   '<svg class="icon toast-icon" viewBox="0 0 24 24"><path d="M12 2v6l4 2"/><path d="M4 12a8 8 0 1 0 16 0 8 8 0 0 0-16 0z"/></svg>',
    success: '<svg class="icon toast-icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    danger:  '<svg class="icon toast-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    info:    '<svg class="icon toast-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  };
  const el = document.createElement('div');
  el.className = `toast ${variant}`;
  el.innerHTML = `
    ${icons[variant] || icons.info}
    <div style="flex:1">
      <div class="toast-title">${escapeHTML(title)}</div>
      ${desc ? `<div class="toast-desc">${escapeHTML(desc)}</div>` : ''}
    </div>
    <button class="toast-close" aria-label="Cerrar">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  `;
  el.querySelector('.toast-close').addEventListener('click', () => el.remove());
  $('#toastHost').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3600);
}

/* ============================================================
   AUTO-RESIZE de textareas
   ============================================================ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

/* ============================================================
   RENDER — Catálogo
   ============================================================ */
function renderCatalogo() {
  const groups = {};
  SERVICIOS.forEach(s => { (groups[s.cat] = groups[s.cat] || []).push(s); });

  const html = Object.entries(groups).map(([cat, list]) => `
    <section class="cat-block">
      <div class="cat-head">
        <span class="cat-name">${escapeHTML(cat)}</span>
        <span class="cat-rule"></span>
        <span class="cat-count">${list.length}</span>
      </div>
      <div class="serv-grid">
        ${list.map(s => {
          const hasRange = s.precioMin != null;
          const priceMain = hasRange ? fmt(s.precioMin) : fmt(s.precio);
          const pricePrefix = hasRange ? 'Desde ' : '';
          const rangeHTML = hasRange
            ? `<div class="serv-range">${fmt(s.precioMin)} – ${fmt(s.precioMax)}</div>`
            : '';
          return `
            <button class="serv" data-add="${s.id}">
              <div class="serv-name">${escapeHTML(s.nombre)}</div>
              ${s.desc ? `<div class="serv-desc">${escapeHTML(s.desc)}</div>` : ''}
              <div class="serv-foot">
                <span class="serv-price">${pricePrefix}${priceMain}<small>/ ${escapeHTML(s.unidad)}</small></span>
              </div>
              ${rangeHTML}
            </button>
          `;
        }).join('')}
      </div>
    </section>
  `).join('');

  $('#catalogo').innerHTML = html;
  $$('[data-add]').forEach(el => {
    el.addEventListener('click', () => addServicio(el.dataset.add));
  });
}

/* ============================================================
   RENDER — Cotización
   ============================================================ */
function renderCotizacion() {
  $('#cliente').value = state.cliente;
  $('#proyecto').value = state.proyecto;
  $('#fecha').value = state.fecha;
  $('#descuento').value = state.descuento;
  $('#notas').value = state.notas;

  const n = state.items.length;
  $('#badgeCount').textContent = `${n} ${n === 1 ? 'ítem' : 'ítems'}`;

  const list = $('#itemsList');
  if (n === 0) {
    list.innerHTML = `
      <div class="empty-msg">
        Aún no hay ítems.<br>Haz clic en un servicio del catálogo para añadirlo.
      </div>
    `;
  } else {
    list.innerHTML = state.items.map((it, i) => {
      const sub = (Number(it.cantidad) || 0) * (Number(it.precio) || 0);
      const step = it.unidad === 'hora' ? '0.5' : '1';
      const min = it.unidad === 'hora' ? '0.5' : '1';
      const nameHTML = it.custom
        ? `<input type="text" data-name="${i}" value="${escapeHTML(it.nombre)}" placeholder="Nombre del servicio" />`
        : escapeHTML(it.nombre);
      const hint = it.rango
        ? `<div class="item-hint">Rango sugerido: ${fmt(it.rango[0])} – ${fmt(it.rango[1])}</div>`
        : '';
      const unitShort = (it.unidad || '').slice(0, 3);
      return `
        <div class="item">
          <div class="item-name">${nameHTML}</div>
          <button class="item-remove" data-remove="${i}" aria-label="Quitar">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
          <textarea
            class="item-desc"
            data-desc="${i}"
            rows="1"
            placeholder="Añadir descripción…"
          >${escapeHTML(it.descripcion || '')}</textarea>
          <div class="item-row">
            <div class="qty-suffix" data-unit="${escapeHTML(unitShort)}">
              <input type="number" data-cant="${i}" value="${it.cantidad}" min="${min}" step="${step}" />
            </div>
            <input type="number" data-precio="${i}" value="${it.precio}" min="0" step="0.01" />
            <span class="item-sub">${fmt(sub)}</span>
          </div>
          ${hint}
        </div>
      `;
    }).join('');
  }

  // Bindings
  $$('[data-remove]').forEach(b => b.addEventListener('click', () => removeItem(+b.dataset.remove)));

  $$('[data-cant]').forEach(inp => inp.addEventListener('input', () => {
    const i = +inp.dataset.cant;
    state.items[i].cantidad = inp.value === '' ? 0 : Number(inp.value);
    save(); updateTotales();
    const sub = (Number(state.items[i].cantidad) || 0) * (Number(state.items[i].precio) || 0);
    const row = inp.closest('.item');
    if (row) row.querySelector('.item-sub').textContent = fmt(sub);
  }));

  $$('[data-precio]').forEach(inp => inp.addEventListener('input', () => {
    const i = +inp.dataset.precio;
    state.items[i].precio = inp.value === '' ? 0 : Number(inp.value);
    save(); updateTotales();
    const sub = (Number(state.items[i].cantidad) || 0) * (Number(state.items[i].precio) || 0);
    const row = inp.closest('.item');
    if (row) row.querySelector('.item-sub').textContent = fmt(sub);
  }));

  $$('[data-name]').forEach(inp => inp.addEventListener('input', () => {
    const i = +inp.dataset.name;
    state.items[i].nombre = inp.value;
    save();
  }));

  // Descripción editable + auto-resize
  $$('[data-desc]').forEach(ta => {
    autoResize(ta);
    ta.addEventListener('input', () => {
      const i = +ta.dataset.desc;
      state.items[i].descripcion = ta.value;
      save();
      autoResize(ta);
    });
  });

  updateTotales();
}

function updateTotales() {
  const sub = state.items.reduce((a, it) => a + (Number(it.cantidad) || 0) * (Number(it.precio) || 0), 0);
  const d = Math.min(100, Math.max(0, Number(state.descuento) || 0));
  const total = sub * (1 - d / 100);
  $('#subtotal').textContent = fmt(sub);
  $('#total').textContent = fmt(total);
}

/* ---------- Saved ---------- */
function renderGuardadas() {
  const el = $('#savedList');
  $('#badgeSaved').textContent = state.guardadas.length;
  if (state.guardadas.length === 0) {
    el.innerHTML = `<span style="font-size:12px;color:var(--text-subtle)">Aún no has guardado ninguna.</span>`;
    return;
  }
  el.innerHTML = state.guardadas.map(g => `
    <div class="saved-item">
      <span class="si-name" title="${escapeHTML(g.nombre)}">${escapeHTML(g.nombre)}</span>
      <span class="si-date">${escapeHTML(formatDate(g.fecha, 'es-VE'))}</span>
      <button data-load="${g.id}" aria-label="Abrir">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
      <button class="danger" data-del="${g.id}" aria-label="Eliminar">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  `).join('');

  $$('[data-load]').forEach(b => b.addEventListener('click', () => {
    const g = state.guardadas.find(x => x.id === b.dataset.load);
    if (!g) return;
    Object.assign(state, JSON.parse(JSON.stringify(g.snapshot)));
    save(); renderCotizacion();
    toast('Cotización abierta', g.nombre, 'info');
  }));
  $$('[data-del]').forEach(b => b.addEventListener('click', () => {
    state.guardadas = state.guardadas.filter(x => x.id !== b.dataset.del);
    save(); renderGuardadas();
  }));
}

/* ============================================================
   ACCIONES
   ============================================================ */
function addServicio(id) {
  const s = servicio(id);
  if (!s) return;
  state.items.push({
    sid: id,
    nombre: s.nombre,
    descripcion: s.desc || '',
    cantidad: 1,
    precio: precioBase(s),
    unidad: s.unidad,
    rango: s.precioMin != null ? [s.precioMin, s.precioMax] : null,
  });
  save(); renderCotizacion();
}

function addCustom() {
  state.items.push({
    nombre: 'Línea personalizada',
    descripcion: '',
    cantidad: 1,
    precio: 0,
    unidad: 'unidad',
    custom: true,
  });
  save(); renderCotizacion();
}

function removeItem(i) { state.items.splice(i, 1); save(); renderCotizacion(); }

/* ---------- Acciones con modal ---------- */
function nuevaCotizacion() {
  if (state.items.length === 0) {
    resetState();
    return;
  }
  Modal.open({
    title: 'Empezar nueva cotización',
    body: 'Se perderán los cambios actuales si no los has guardado antes.',
    confirmLabel: 'Empezar nueva',
    cancelLabel: 'Cancelar',
    danger: true,
    onConfirm: () => {
      resetState();
      toast('Cotización nueva', 'Lista para empezar.', 'success');
    }
  });
}

function vaciarCotizacion() {
  const isEmpty = state.items.length === 0 && !state.cliente && !state.proyecto && !state.notas;
  if (isEmpty) return;
  Modal.open({
    title: 'Vaciar cotización',
    body: 'Se eliminarán todos los ítems, el cliente y las notas. Esta acción no se puede deshacer.',
    confirmLabel: 'Vaciar',
    danger: true,
    onConfirm: () => {
      resetState();
      toast('Cotización vaciada', '', 'info');
    }
  });
}

function guardarCotizacion() {
  if (state.items.length === 0) {
    toast('Nada que guardar', 'Añade al menos un ítem antes de guardar.', 'danger');
    return;
  }
  const def = (state.cliente || 'Cotización') + ' · ' + (state.proyecto || state.fecha);
  Modal.open({
    title: 'Guardar cotización',
    body: 'Ponle un nombre para identificarla después en la lista de guardadas.',
    input: true,
    placeholder: 'Ej. Estudio Norte · Marzo 2026',
    defaultValue: def,
    confirmLabel: 'Guardar',
    onConfirm: (nombre) => {
      if (!nombre) {
        toast('Nombre requerido', 'Escribe un nombre para la cotización.', 'danger');
        return false;
      }
      const snapshot = {
        cliente: state.cliente, proyecto: state.proyecto, fecha: state.fecha,
        descuento: state.descuento, notas: state.notas,
        items: JSON.parse(JSON.stringify(state.items)),
      };
      state.guardadas.unshift({ id: 'c' + Date.now(), nombre, fecha: state.fecha, snapshot });
      save(); renderGuardadas();
      toast('Cotización guardada', nombre, 'success');
    }
  });
}

function resetState() {
  state.items = [];
  state.cliente = '';
  state.proyecto = '';
  state.notas = '';
  state.descuento = 0;
  state.fecha = today();
  save();
  renderCotizacion();
}

/* ============================================================
   PDF
   ============================================================ */
function buildPrintArea() {
  const sub = state.items.reduce((a, it) => a + (Number(it.cantidad) || 0) * (Number(it.precio) || 0), 0);
  const d = Math.min(100, Math.max(0, Number(state.descuento) || 0));
  const total = sub * (1 - d / 100);

  const rows = state.items.map(it => {
    const cant = Number(it.cantidad) || 0;
    const p = Number(it.precio) || 0;
    const lin = cant * p;

    let priceHTML;
    if (p === 0) {
      priceHTML = `<span class="incluido">Incluido</span>`;
    } else if (cant > 1) {
      priceHTML = `${fmt(lin)}<small>${cant} × ${fmt(p)}</small>`;
    } else {
      priceHTML = fmt(lin);
    }

    const desc = it.descripcion ? escapeHTML(it.descripcion) : '';

    return `
      <tr>
        <td class="c-name">${escapeHTML(it.nombre)}</td>
        <td class="c-desc">${desc}</td>
        <td class="c-price num">${priceHTML}</td>
      </tr>
    `;
  }).join('');

  const descLine = d > 0
    ? `<div class="l"><span>Descuento (${d}%)</span><span>− ${fmt(sub - total)}</span></div>`
    : '';

  $('#printArea').innerHTML = `
    <div class="print-doc">

      <header class="print-header">
        <div class="print-brand">
          <div class="print-brand-mark">Ae</div>
          <div>
            <div class="print-brand-name">
              ${escapeHTML(EMPRESA.nombre)} <span>${escapeHTML(EMPRESA.tld)}</span>
            </div>
            <div class="print-brand-tag">${escapeHTML(EMPRESA.tagline)}</div>
          </div>
        </div>
        <div class="print-contact">
          <div>${escapeHTML(EMPRESA.email)}</div>
          <div>${escapeHTML(EMPRESA.web)}</div>
          <div>${escapeHTML(EMPRESA.telefono)}</div>
        </div>
      </header>

      <div class="print-title-block">
        <div class="print-eyebrow">Cotización</div>
        <h1 class="print-title">
          ${escapeHTML(state.proyecto || 'Propuesta y plan de contenido')}
        </h1>
      </div>

      <div class="print-meta">
        <div class="row"><span class="k">Cliente</span><span class="v">${escapeHTML(state.cliente || '—')}</span></div>
        <div class="row"><span class="k">Proyecto</span><span class="v">${escapeHTML(state.proyecto || '—')}</span></div>
        <div class="row"><span class="k">Fecha</span><span class="v">${formatDate(state.fecha)}</span></div>
        <div class="row"><span class="k">Validez</span><span class="v">${escapeHTML(EMPRESA.validez)}</span></div>
      </div>

      <table class="print-table">
        <thead>
          <tr>
            <th>Concepto</th>
            <th>Descripción</th>
            <th class="num">Precio</th>
          </tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="3" style="color:#999;padding:20px 0">Sin ítems.</td></tr>`}
        </tbody>
      </table>

      <div class="print-totals">
        <div class="l"><span>Subtotal</span><span>${fmt(sub)}</span></div>
        ${descLine}
        <div class="l big"><span>Total</span><span>${fmt(total)} USD</span></div>
      </div>

      ${state.notas ? `
        <div class="print-notes">
          <strong>Notas y condiciones</strong>
          ${escapeHTML(state.notas)}
        </div>
      ` : ''}

      <footer class="print-footer">
        <span>${escapeHTML(EMPRESA.nombre + EMPRESA.tld)}</span>
        <span>Gracias por la confianza</span>
      </footer>

    </div>
  `;
}

$('#cliente').addEventListener('input', e => { state.cliente = e.target.value; save(); });
$('#proyecto').addEventListener('input', e => { state.proyecto = e.target.value; save(); });
$('#fecha').addEventListener('input', e => { state.fecha = e.target.value; save(); });
$('#notas').addEventListener('input', e => { state.notas = e.target.value; save(); });
$('#descuento').addEventListener('input', e => {
  state.descuento = e.target.value === '' ? 0 : Number(e.target.value);
  save(); updateTotales();
});

$('#btnCustom').addEventListener('click', addCustom);
$('#btnNueva').addEventListener('click', nuevaCotizacion);
$('#btnLimpiar').addEventListener('click', vaciarCotizacion);
$('#btnGuardar').addEventListener('click', guardarCotizacion);

$('#btnExportar').addEventListener('click', () => {
  const filename = (state.cliente || 'cotizacion').replace(/\s+/g, '_').toLowerCase();
  exportJSON(state, filename);
  toast('Exportado', filename + '.json', 'success');
});

$('#btnImportar').addEventListener('click', () => {
  importJSON(data => {
    state = { ...state, ...data };
    save(); renderCotizacion(); renderGuardadas();
    toast('Importado correctamente', '', 'success');
  });
});

$('#btnImprimir').addEventListener('click', () => {
  if (state.items.length === 0) { toast('Nada que imprimir', 'Añade al menos un ítem.', 'danger'); return; }
  buildPrintArea();
  requestAnimationFrame(() => window.print());
});

/* Theme toggle */
(function () {
  const KEY = 'ae-theme';
  const saved = localStorage.getItem(KEY);
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  $('#themeToggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(KEY, next);
  });
})();

Modal.init();
load();
renderCatalogo();
renderCotizacion();
renderGuardadas();
</script>
